<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Family Grand Prix</title><style>*{box-sizing:border-box}body{margin:0;background:#173047;color:white;font:15px system-ui;overflow:hidden;touch-action:none}canvas{width:100vw;height:100dvh;display:block}button{padding:13px;border:1px solid #ffffff80;background:#142b43ee;color:white;border-radius:12px;font-weight:bold;touch-action:none}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;text-shadow:2px 2px black;pointer-events:none}#tools{position:fixed;top:68px;right:12px}#controls{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:14px;right:14px;display:flex;justify-content:space-between}#controls button{height:60px;min-width:68px}#msg{position:fixed;bottom:91px;width:100%;text-align:center;pointer-events:none;text-shadow:2px 2px black}#panel{position:fixed;inset:0;background:#071729df;display:grid;place-items:center;padding:18px}article{background:#19344b;border-radius:18px;padding:24px;max-width:430px;text-align:center}p{line-height:1.5}progress{width:100%}#notice{font-size:13px;color:#c6dce9}</style><canvas id="c"></canvas><div id="hud"><span id="stats"></span><span id="speed"></span></div><div id="tools"><button id="pause">Pause</button> <button id="mute">Sound ON</button></div><div id="msg"></div><div id="controls"><button id="left">◀</button><button id="brake">BRAKE</button><button id="right">▶</button></div><div id="panel"><article><h1 id="title">Family Grand Prix</h1><p id="summary">Automatic acceleration. Avoid traffic: collisions slow you down! Steer with touch, arrows or A/D. Brake with ↓ or Space. Complete five stages to finish.</p><progress id="progress" max="9000" value="0"></progress><p><button id="start">Start race</button> <button id="tilt">Enable / calibrate tilt</button></p><p id="notice">Built-in engine and brake sounds. Phone tilt may require HTTPS.</p></article></div><script>
'use strict';const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d');let W,H;function resize(){W=c.width=innerWidth;H=c.height=innerHeight}resize();addEventListener('resize',resize);const total=9000,view=1800;let mode='menu',speed=0,dist=0,x=0,stage=1,time=0,hits=0,last=0,cars=[],keys={},tilt=0,baseline=null,listening=false,muted=false,flash=0;let ac,master,engine,osc,brakeGain;
function initAudio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:.16;master.connect(ac.destination);osc=ac.createOscillator();osc.type='sawtooth';engine=ac.createGain();engine.gain.value=0;const f=ac.createBiquadFilter();f.frequency.value=550;osc.connect(f);f.connect(engine);engine.connect(master);osc.start();const b=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const n=ac.createBufferSource(),nf=ac.createBiquadFilter();n.buffer=b;n.loop=true;nf.type='bandpass';nf.frequency.value=1700;brakeGain=ac.createGain();brakeGain.gain.value=0;n.connect(nf);nf.connect(brakeGain);brakeGain.connect(master);n.start()}ac.resume().catch(()=>{})}
function quiet(){if(ac)for(const a of [engine.gain,brakeGain.gain]){a.cancelScheduledValues(ac.currentTime);a.value=0}}
function bump(){if(!ac)return;const o=ac.createOscillator(),v=ac.createGain(),t=ac.currentTime;o.type='triangle';o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(30,t+.22);v.gain.setValueAtTime(.9,t);v.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(v);v.connect(master);o.start();o.stop(t+.23);o.onended=()=>{o.disconnect();v.disconnect()}}
function traffic(){cars=Array.from({length:stage+5},(_,i)=>({z:dist+350+i*260,x:[0,-.65,.65][i%3],v:20+Math.random()*12,color:['#ffe02b','#24cfff','#b766ff'][i%3],touching:false}))}
function start(){try{initAudio()}catch(e){}if(mode!=='paused'){speed=0;dist=0;x=0;stage=1;time=0;hits=0;flash=0;traffic()}mode='race';keys={};$('panel').style.display='none'}$('start').onclick=start;
function pause(){if(mode!=='race')return;mode='paused';keys={};quiet();$('title').textContent='Paused';$('summary').textContent='Your race progress is saved for this session.';$('start').textContent='Resume';$('panel').style.display='grid'}$('pause').onclick=pause;addEventListener('blur',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});$('mute').onclick=()=>{muted=!muted;if(master)master.gain.value=muted?0:.16;$('mute').textContent=muted?'Sound OFF':'Sound ON'};
for(const id of ['left','right','brake']){const e=$(id);e.onpointerdown=p=>{p.preventDefault();e.setPointerCapture(p.pointerId);keys[id]=true};e.onpointerup=e.onpointercancel=()=>keys[id]=false}function key(e,v){const k={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowDown:'brake',s:'brake',' ':'brake'}[e.key];if(k){e.preventDefault();keys[k]=v}}addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));
$('tilt').onclick=async()=>{try{if(!window.DeviceOrientationEvent)throw Error('Tilt unavailable');if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted')throw Error('Permission denied');baseline=null;tilt=0;if(!listening){addEventListener('deviceorientation',e=>{if(e.gamma==null)return;const a=screen.orientation?screen.orientation.angle:(window.orientation||0),v=Math.abs(a)===90?e.beta*Math.sign(a):e.gamma;if(baseline===null)baseline=v;const d=v-baseline;tilt=Math.abs(d)<4?0:Math.sign(d)*Math.min(1,(Math.abs(d)-4)/20)});listening=true}$('notice').textContent='Tilt enabled. Hold comfortably to calibrate.'}catch(e){$('notice').textContent=e.message+'. Use touch or keyboard.'}};addEventListener('orientationchange',()=>{baseline=null;tilt=0});
function projection(z){const p=Math.pow(1-Math.max(0,z)/view,2);return{y:H*.39+p*(Math.max(H*.58,H-145)-H*.39),w:W*.035+p*W*.52}}
function quad(f,n,l,r,color){g.fillStyle=color;g.beginPath();g.moveTo(W/2+f.w*l,f.y);g.lineTo(W/2+f.w*r,f.y);g.lineTo(W/2+n.w*r,n.y);g.lineTo(W/2+n.w*l,n.y);g.closePath();g.fill()}
function car(cx,cy,w,color){const h=w*.85;g.save();g.translate(cx,cy);g.fillStyle='#0005';g.beginPath();g.ellipse(0,-h*.15,w*.57,h*.17,0,0,7);g.fill();for(const side of [-1,1]){const tx=side*w*.37;g.fillStyle='#111318';g.fillRect(tx-w*.12,-h*.48,w*.24,h*.43);g.fillRect(tx-w*.085,-h*.84,w*.17,h*.24);g.fillStyle='#44474b';g.fillRect(tx-w*.09,-h*.44,w*.18,h*.035)}g.fillStyle=color;g.beginPath();g.moveTo(-w*.12,-h*.98);g.lineTo(w*.12,-h*.98);g.lineTo(w*.19,-h*.57);g.lineTo(w*.3,-h*.42);g.lineTo(w*.3,-h*.18);g.lineTo(-w*.3,-h*.18);g.lineTo(-w*.3,-h*.42);g.lineTo(-w*.19,-h*.57);g.closePath();g.fill();g.fillRect(-w*.34,-h*.84,w*.68,h*.06);g.fillRect(-w*.46,-h*.19,w*.92,h*.12);g.fillStyle='#f4f4ed';g.fillRect(-w*.035,-h*.95,w*.07,h*.34);g.fillStyle='#142b37';g.beginPath();g.ellipse(0,-h*.48,w*.13,h*.16,0,0,7);g.fill();g.fillStyle='#fff7a2';g.beginPath();g.arc(0,-h*.51,w*.065,0,7);g.fill();g.fillStyle='#ff5744';g.fillRect(-w*.04,-h*.2,w*.08,h*.07);g.restore()}
function overlap(a){const z=a.z-dist;if(z<0||z>view)return false;const p=projection(0),q=projection(z),pw=p.w*.26,aw=q.w*.26;const px=W/2+x*p.w,ax=W/2+a.x*q.w;const horizontal=Math.abs(px-ax)<.48*(pw+aw);const vertical=q.y>p.y-pw*.85*.95&&q.y-aw*.85*.95<p.y;return horizontal&&vertical}
function update(dt){if(mode!=='race')return;time+=dt;speed=Math.max(0,Math.min(62+stage*3,speed+(keys.brake?-100:25)*dt));const steer=(keys.right?1:0)-(keys.left?1:0)+tilt;x=Math.max(-1.4,Math.min(1.4,x+steer*dt*(.4+speed/45)));if(Math.abs(x)>1)speed=Math.max(0,speed-40*dt);dist=Math.min(total,dist+speed*dt);flash=Math.max(0,flash-dt);const ns=Math.min(5,1+Math.floor(dist/1800));if(ns!==stage){stage=ns;traffic()}for(const a of cars){a.z+=a.v*dt;const touching=overlap(a);if(touching&&!a.touching){speed*=.5;hits++;flash=.55;bump()}a.touching=touching;if(a.z-dist< -120){a.z=dist+view+Math.random()*400;a.x=[-.65,0,.65][Math.floor(Math.random()*3)];a.touching=false}}$('stats').textContent=`STAGE ${stage}/5 · ${Math.floor(dist/total*100)}% · HITS ${hits}`;$('speed').textContent=Math.round(speed*3.6)+' km/h';$('progress').value=dist;$('msg').textContent=flash>0?'Collision! Speed reduced':Math.abs(x)>1?'Grass slows you down':`Auto-drive · ${Math.ceil(total-dist)} m to finish`;if(ac){osc.frequency.setTargetAtTime(45+speed*2.8,ac.currentTime,.08);engine.gain.setTargetAtTime(.05+speed/300,ac.currentTime,.08);brakeGain.gain.setTargetAtTime(keys.brake&&speed>10?.2:0,ac.currentTime,.04)}if(dist>=total){mode='finished';quiet();$('title').textContent='🏁 Race complete!';$('summary').textContent=`Five stages finished in ${time.toFixed(1)} seconds. Collisions: ${hits}.`;$('start').textContent='Race again';$('panel').style.display='grid'}}
function road(){const f=projection(view),n=projection(0);quad(f,n,-1.12,1.12,'white');for(let z=view;z>0;z-=12)if(Math.floor((dist+z)/45)%2===0){const a=projection(z),b=projection(Math.max(0,z-13));quad(a,b,-1.12,-1,'#d6252b');quad(a,b,1,1.12,'#d6252b')}quad(f,n,-1,1,'#777c80');for(const e of [-1,1])quad(f,n,e-.013,e+.013,'white');for(let world=Math.floor(dist/90)*90;world<dist+view;world+=90){const a=Math.max(0,world-dist),b=Math.min(view,world+45-dist);if(b<=a)continue;for(const lane of [-1/3,1/3])quad(projection(b),projection(a),lane-.018,lane+.018,'white')}}
function draw(){g.fillStyle='#1bc6e8';g.fillRect(0,0,W,H);g.fillStyle='#4c627d';g.beginPath();g.moveTo(0,H*.43);for(let i=0;i<=W+25;i+=25)g.lineTo(i,H*(.36+.025*Math.sin(i*.07)));g.lineTo(W,H*.43);g.fill();g.fillStyle='#775332';g.fillRect(0,H*.405,W,H*.025);g.fillStyle='#449742';g.fillRect(0,H*.43,W,H*.57);const p=projection(0);g.fillStyle='#777c80';g.fillRect(0,p.y,W,H-p.y+1);road();const finish=total-dist;if(finish>0&&finish<view)for(let i=0;i<12;i++)quad(projection(finish+12),projection(finish),-1+i/6,-1+(i+1)/6,i%2?'white':'#111');for(const a of [...cars].sort((a,b)=>b.z-a.z)){const z=a.z-dist;if(z>=0&&z<view){const q=projection(z);car(W/2+a.x*q.w,q.y,q.w*.26,a.color)}}car(W/2+x*p.w,p.y,p.w*.26,'#ec3239');if(flash>0){g.fillStyle='rgba(255,40,20,'+(flash*.23)+')';g.fillRect(0,0,W,H)}}
function frame(t){let dt=Math.min(.04,(t-last)/1000||.016);last=t;while(dt>0){const step=Math.min(dt,1/120);update(step);dt-=step}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
