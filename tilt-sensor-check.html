<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tilt sensor check</title><style>body{background:#102336;color:#e7f3ff;font:16px system-ui;padding:18px;max-width:700px;margin:auto}button{padding:16px;background:#1769ae;color:white;border:0;border-radius:9px;font-size:17px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#071726;padding:16px;border-radius:10px;line-height:1.6}#dot{height:30px;width:30px;background:#ffd44b;border-radius:50%;position:relative;left:calc(50% - 15px)}#track{height:40px;background:#29425a;overflow:hidden;margin:20px 0}</style><h1>Phone tilt diagnostic</h1><p>Upload this HTML beside your game and open its HTTPS address directly. Tap Start, then tilt left/right and forward/back. Keep this page visible.</p><button id="start">Start sensor test</button><div id="track"><div id="dot"></div></div><pre id="out"></pre><p>This test sends no sensor readings anywhere. Copy or screenshot the result to share it.</p><script>
const out=document.getElementById('out');let orientCount=0,motionCount=0,orient=null,motion=null,status='Not started',permission='Not requested',started=0,running=false;function num(v){return typeof v==='number'&&Number.isFinite(v)?v.toFixed(2):String(v)}function render(){const seconds=started?((performance.now()-started)/1000).toFixed(0):'0';let result=status;if(running&&performance.now()-started>7000){if(!orientCount&&!motionCount)result='No sensor events received. Compare this same URL in Chrome.';else if(!orient&& !motion)result='Events arrived, but sensor values are null.';else if(orient)result='Orientation data is arriving. If values change with tilt, the game needs a control fix.';else result='Motion data is arriving, but usable orientation data is absent.'}out.textContent=`Status: ${result}\nSecure context: ${window.isSecureContext}\nProtocol: ${location.protocol}\nTop-level page: ${window.top===window.self}\nOrientation API: ${typeof window.DeviceOrientationEvent}\nMotion API: ${typeof window.DeviceMotionEvent}\nPermission: ${permission}\nSeconds: ${seconds}\nOrientation events: ${orientCount}\nMotion events: ${motionCount}\n\nLatest orientation:\n${orient?JSON.stringify(orient,null,2):'No numeric readings'}\n\nLatest acceleration including gravity:\n${motion?JSON.stringify(motion,null,2):'No numeric readings'}\n\nBrowser: ${navigator.userAgent}`}
addEventListener('deviceorientation',e=>{if(!running)return;orientCount++;if([e.alpha,e.beta,e.gamma].some(v=>typeof v==='number'&&Number.isFinite(v))){orient={alpha:num(e.alpha),beta:num(e.beta),gamma:num(e.gamma)};if(typeof e.gamma==='number')document.getElementById('dot').style.transform='translateX('+Math.max(-120,Math.min(120,e.gamma*3))+'px)'}});addEventListener('devicemotion',e=>{if(!running)return;motionCount++;let a=e.accelerationIncludingGravity;if(a&&[a.x,a.y,a.z].some(v=>typeof v==='number'&&Number.isFinite(v)))motion={x:num(a.x),y:num(a.y),z:num(a.z)}});
document.getElementById('start').onclick=async()=>{running=true;started=performance.now();orientCount=motionCount=0;orient=motion=null;status='Listening — tilt your phone';permission='No requestPermission method required';const requests=[];for(const [name,C] of [['orientation',window.DeviceOrientationEvent],['motion',window.DeviceMotionEvent]]){if(C&&typeof C.requestPermission==='function'){try{requests.push(C.requestPermission().then(v=>name+': '+v).catch(e=>name+': '+e.message))}catch(e){requests.push(Promise.resolve(name+': '+e.message))}}}if(requests.length)permission=(await Promise.all(requests)).join('; ');render()};setInterval(render,500);render();
</script></html>
